<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Outer orbit path -->
  <ellipse cx="12" cy="12" rx="9" ry="4.5" stroke="#C5C5C5" stroke-width="1.5" transform="rotate(-30 12 12)" opacity="0.85"/>
  <!-- Central node / core -->
  <circle cx="12" cy="12" r="3.5" fill="#C5C5C5"/>
  <!-- Orbiting satellite body -->
  <circle cx="17.5" cy="8.2" r="1.8" fill="#C5C5C5"/>
</svg>
